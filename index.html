<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .error-message {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Login</h1>

        <form class="login-form" onsubmit="return validateLogin(event)">
            <div class="input-container">
                <input type="text" id="username" placeholder=" " required>
                <label for="username">User</label>
            </div>
            <div class="input-container">
                <input type="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
            </div>

            <a href="#" class="forgot-password">Forgot password?</a>

            <button type="submit" class="login-btn">Enter</button>
            <div id="error-message" class="error-message">Usuario o contraseña incorrectos.</div>
        </form>
        
        <div class="social-icons">
            <a href="#" class="social-icon google">
                <i class="fab fa-google"></i>
            </a>
            
            <a href="#" class="social-icon twitch">
                <i class="fab fa-twitch"></i>
            </a>

            <a href="#" class="social-icon apple">
                <i class="fab fa-apple"></i>
            </a>
        </div>        
    </div>

    <script>
        function validateLogin(event) {
            event.preventDefault(); // Evita que se recargue el formulario

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("error-message");

            if (username === "Thedogsito" && password === "._Thedogsito__.") {
                window.location.href = "ahorros.html";
            } else {
                errorMsg.style.display = "block";
            }

            return false;
        }
    </script>
</body>
</html>
